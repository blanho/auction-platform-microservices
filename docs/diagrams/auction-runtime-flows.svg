<text x="1302" y="1011.42" fill="#53677D" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" text-anchor="start">Workload identity</text>
<text x="35" y="1111.44" fill="#53677D" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">Other services: Identity owns authentication; Analytics consumes reporting events; Job owns general scheduled and operational jobs.</text>
<text x="35" y="1161.44" fill="#53677D" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">Real-time deployment gap: configure the browser production hub URL and a cross-replica SignalR delivery mechanism.</text>
<text x="35" y="1216.92" fill="#53677D" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" text-anchor="start">Source: service code, architecture guide, production Kubernetes overlay and Azure Bicep. No cloud resources were deployed.</text>
