<text x="35" y="60.88" fill="#16324F" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="600" text-anchor="start">Auction platform | Key runtime flows</text>
<text x="35" y="105.44" fill="#53677D" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">Service names repeat across lanes. These are selected interactions, not a complete endpoint or event inventory.</text>
<text x="55" y="196.12" fill="#16324F" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" text-anchor="start">01  •  Bid entry and internal gRPC relationships</text>
<text x="83" y="277.78" fill="#16324F" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" text-anchor="start">Browser</text>
<text x="83" y="308.92" fill="#53677D" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" text-anchor="start">Authenticated request</text>
<text x="408" y="277.78" fill="#16324F" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" text-anchor="start">YARP gateway</text>
<text x="408" y="308.92" fill="#53677D" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" text-anchor="start">REST routing</text>
<text x="733" y="277.78" fill="#16324F" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" text-anchor="start">Bidding</text>
<text x="733" y="308.92" fill="#53677D" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" text-anchor="start">Bid ordering + PostgreSQL lock</text>
<text x="1058" y="277.78" fill="#16324F" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" text-anchor="start">Auction</text>
<text x="1058" y="308.92" fill="#53677D" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" text-anchor="start">Snapshot-miss validation</text>
<text x="1383" y="277.78" fill="#16324F" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" text-anchor="start">Catalog</text>
<text x="1383" y="308.92" fill="#53677D" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" text-anchor="start">Catalog queries</text>
<text x="65" y="360.26" fill="#53677D" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">Bidding → Auction: validation fallback. Auction → Bidding: winner finalization. Catalog lookup is a separate gRPC use case.</text>
<text x="55" y="466.12" fill="#16324F" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" text-anchor="start">02  •  Sale coordination and durable messaging</text>
<text x="83" y="552.78" fill="#16324F" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" text-anchor="start">Auction</text>
<text x="83" y="583.92" fill="#53677D" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" text-anchor="start">Quartz close / buy-now flow</text>
<text x="463" y="552.78" fill="#16324F" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" text-anchor="start">RabbitMQ</text>
<text x="463" y="583.92" fill="#53677D" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" text-anchor="start">MassTransit events + commands</text>
<text x="868" y="542.78" fill="#16324F" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" text-anchor="start">Orchestration</text>
<text x="868" y="575.795" fill="#53677D" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" text-anchor="start">Saga state + recovery cases</text>
<text x="868" y="592.045" fill="#53677D" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" text-anchor="start">Own PostgreSQL database</text>
<text x="1298" y="512.78" fill="#16324F" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" text-anchor="start">Payment</text>
<text x="1298" y="541.42" fill="#53677D" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" text-anchor="start">Order / payment operations</text>
<text x="1298" y="627.78" fill="#16324F" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" text-anchor="start">Notification</text>
<text x="1298" y="656.42" fill="#53677D" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" text-anchor="start">Sale notification delivery</text>
<text x="65" y="689.76" fill="#53677D" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" text-anchor="start">Coordinator commands and acknowledgments travel through RabbitMQ; service database transactions use inbox/outbox patterns where configured.</text>
<text x="55" y="786.12" fill="#16324F" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" text-anchor="start">03  •  Projections, real-time updates and files</text>
