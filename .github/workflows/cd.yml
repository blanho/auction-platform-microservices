name: Azure CD

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy the built images to production AKS'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AKS_CLUSTER_NAME: ${{ vars.AKS_CLUSTER_NAME }}
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
  KEY_VAULT_NAME: ${{ vars.KEY_VAULT_NAME }}
  SECRETS_IDENTITY_CLIENT_ID: ${{ vars.SECRETS_IDENTITY_CLIENT_ID }}
  STORAGE_ACCOUNT_NAME: ${{ vars.STORAGE_ACCOUNT_NAME }}
  STORAGE_IDENTITY_CLIENT_ID: ${{ vars.STORAGE_IDENTITY_CLIENT_ID }}
  API_DOMAIN: ${{ vars.API_DOMAIN }}
  WEB_DOMAIN: ${{ vars.WEB_DOMAIN }}
  CERT_MANAGER_EMAIL: ${{ vars.CERT_MANAGER_EMAIL }}

jobs:
  build-images:
    name: Build ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: identity-api, dockerfile: src/Services/Identity/Identity.Api/Dockerfile }
          - { name: catalog-api, dockerfile: src/Services/Catalog/Catalog.Api/Dockerfile }
          - { name: auction-api, dockerfile: src/Services/Auction/Auction.Api/Dockerfile }
          - { name: bidding-api, dockerfile: src/Services/Bidding/Bidding.Api/Dockerfile }
          - { name: payment-api, dockerfile: src/Services/Payment/Payment.Api/Dockerfile }
          - { name: notification-api, dockerfile: src/Services/Notification/Notification.Api/Dockerfile }
          - { name: analytics-api, dockerfile: src/Services/Analytics/Analytics.Api/Dockerfile }
          - { name: search-api, dockerfile: src/Services/Search/Search.Api/Dockerfile }
          - { name: storage-api, dockerfile: src/Services/Storage/Storage.Api/Dockerfile }
          - { name: job-api, dockerfile: src/Services/Job/Job.Api/Dockerfile }
          - { name: gateway-api, dockerfile: src/Gateway/Gateway.Api/Dockerfile }
          - { name: web, dockerfile: web/Dockerfile }
    steps:
      - name: Determine source revision
        id: revision
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
          else
            SHA="${{ github.sha }}"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=${SHA:0:12}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.revision.outputs.sha }}

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name "${ACR_LOGIN_SERVER%%.*}"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/auction-platform/${{ matrix.service.name }}:${{ steps.revision.outputs.tag }}
          build-args: |
            VITE_API_URL=/api
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

  deploy-production:
    name: Deploy production AKS
    runs-on: ubuntu-latest
    needs: build-images
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    environment:
      name: production
      url: https://${{ vars.WEB_DOMAIN }}
    steps:
      - name: Determine source revision
        id: revision
        shell: bash
        run: |
          SHA="${{ github.sha }}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=${SHA:0:12}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.revision.outputs.sha }}

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/setup-kubectl@v4

      - uses: azure/setup-helm@v4

      - name: Connect to AKS
        run: |
          az aks get-credentials \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AKS_CLUSTER_NAME" \
            --overwrite-existing

      - name: Install cluster prerequisites
        run: |
          helm repo add external-secrets https://charts.external-secrets.io
          helm repo add jetstack https://charts.jetstack.io
          helm repo update
          helm upgrade --install external-secrets external-secrets/external-secrets \
            --namespace external-secrets \
            --create-namespace \
            --wait \
            --timeout 5m
          helm upgrade --install cert-manager jetstack/cert-manager \
            --namespace cert-manager \
            --create-namespace \
            --set crds.enabled=true \
            --wait \
            --timeout 5m

      - name: Render production manifests
        env:
          IMAGE_TAG: ${{ steps.revision.outputs.tag }}
        run: deploy/azure/render-kubernetes.sh > "$RUNNER_TEMP/auction-production.yaml"

      - name: Apply, migrate, and roll out
        run: |
          kubectl delete jobs \
            -n auction-platform \
            -l app.kubernetes.io/part-of=auction-platform \
            --ignore-not-found

          kubectl apply -f "$RUNNER_TEMP/auction-production.yaml"

          kubectl wait \
            --namespace auction-platform \
            --for=condition=Ready \
            externalsecret/auction-platform-secrets \
            --timeout=5m

          kubectl wait \
            --namespace auction-platform \
            --for=condition=complete \
            jobs \
            -l app.kubernetes.io/part-of=auction-platform \
            --timeout=10m

          kubectl rollout status deployment \
            --all \
            --namespace auction-platform \
            --timeout=10m

      - name: Smoke test
        run: |
          curl --fail --retry 12 --retry-all-errors --retry-delay 10 \
            "https://${API_DOMAIN}/health/ready"
          curl --fail --retry 12 --retry-all-errors --retry-delay 10 \
            "https://${WEB_DOMAIN}/"
