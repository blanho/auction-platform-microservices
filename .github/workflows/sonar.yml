name: Sonar Analysis

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Local Sonar C# Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Restore
        run: dotnet restore auction.sln

      - name: Analyze the complete solution
        run: dotnet build auction.sln --configuration Release --no-restore --no-incremental --warnaserror -m:1
