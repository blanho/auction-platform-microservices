services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: '-Xms512m -Xmx512m'
    ports:
      - '127.0.0.1:19200:9200'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS "http://localhost:9200/_cluster/health?wait_for_status=yellow" > /dev/null']
      interval: 5s
      timeout: 5s
      retries: 30
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auction_test
      POSTGRES_PASSWORD: auction_test
      POSTGRES_DB: postgres
    ports:
      - '127.0.0.1:15432:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U auction_test -d postgres']
      interval: 2s
      timeout: 5s
      retries: 30
  rabbitmq:
    image: rabbitmq:3.13-alpine
    ports:
      - '127.0.0.1:15673:5672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 10s
      retries: 30
