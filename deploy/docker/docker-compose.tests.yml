services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auction_test
      POSTGRES_PASSWORD: auction_test
      POSTGRES_DB: postgres
    ports:
      - '127.0.0.1:15432:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U auction_test -d postgres']
      interval: 2s
      timeout: 5s
      retries: 30
  rabbitmq:
    image: rabbitmq:3.13-alpine
    ports:
      - '127.0.0.1:15673:5672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 10s
      retries: 30
