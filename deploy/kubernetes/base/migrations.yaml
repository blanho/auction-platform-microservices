apiVersion: batch/v1
kind: Job
metadata:
  name: identity-api-migration
  namespace: auction-platform
  labels: { app: identity-api-migration, tier: backend }
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: { app: identity-api-migration, tier: backend }
    spec:
      restartPolicy: OnFailure
      serviceAccountName: auction-service-account
      securityContext: { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000 }
      containers:
        - name: migrate
          image: auction-platform/identity-api:latest
          args: ["--migrate-only"]
          envFrom:
            - configMapRef: { name: auction-platform-config }
            - secretRef: { name: auction-platform-secrets }
          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef: { name: auction-platform-secrets, key: IDENTITY_DB_CONNECTION }
            - name: ConnectionStrings__Redis
              valueFrom:
                secretKeyRef: { name: auction-platform-secrets, key: REDIS_CONNECTION }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
---
