apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-api
  namespace: auction-platform
  labels:
    app: gateway-api
    tier: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gateway-api
  template:
    metadata:
      labels:
        app: gateway-api
        tier: frontend
    spec:
      serviceAccountName: auction-service-account
      priorityClassName: auction-critical
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: gateway-api
          image: auction-platform/gateway-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: auction-platform-config
            - secretRef:
                name: auction-platform-secrets
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: ReverseProxy__Clusters__auction-cluster__Destinations__destination1__Address
              value: "http://auction-api:80"
            - name: ReverseProxy__Clusters__catalog-cluster__Destinations__destination1__Address
              value: "http://catalog-api:80"
            - name: ReverseProxy__Clusters__identity-cluster__Destinations__destination1__Address
              value: "http://identity-api:80"
            - name: ReverseProxy__Clusters__bid-cluster__Destinations__destination1__Address
              value: "http://bidding-api:80"
            - name: ReverseProxy__Clusters__notification-cluster__Destinations__destination1__Address
              value: "http://notification-api:80"
            - name: ReverseProxy__Clusters__analytics-cluster__Destinations__destination1__Address
              value: "http://analytics-api:80"
            - name: ReverseProxy__Clusters__payment-cluster__Destinations__destination1__Address
              value: "http://payment-api:80"
            - name: ReverseProxy__Clusters__search-cluster__Destinations__destination1__Address
              value: "http://search-api:80"
            - name: ReverseProxy__Clusters__storage-cluster__Destinations__destination1__Address
              value: "http://storage-api:80"
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          resources:
            requests:
              memory: "256Mi"
              cpu: "150m"
            limits:
              memory: "512Mi"
              cpu: "750m"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-api
  namespace: auction-platform
  labels:
    app: gateway-api
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http-container
  selector:
    app: gateway-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway-api-hpa
  namespace: auction-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
