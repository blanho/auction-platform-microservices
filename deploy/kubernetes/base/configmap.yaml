apiVersion: v1
kind: ConfigMap
metadata:
  name: auction-platform-config
  namespace: auction-platform
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8080"
  ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
  Database__AutoMigrate: "false"
  
  # Database
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  
  # Redis
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  
  # RabbitMQ
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  RabbitMQ__Host: "rabbitmq"
  RabbitMQ__Port: "5672"
  Identity__Authority: "http://identity-api:8080"
  Identity__IssuerUri: "http://identity-api:8080"
  GrpcServices__AuctionService: "http://auction-api:81"
  Elasticsearch__Url: "http://elasticsearch:9200"
  FileStorage__Provider: "AzureBlob"
  FileStorage__AzureBlob__ServiceUri: "https://REPLACE_WITH_STORAGE_ACCOUNT.blob.core.windows.net"
  FileStorage__AzureBlob__ContainerName: "uploads"
  
  # Logging & Observability
  ELASTICSEARCH_URL: "http://elasticsearch:9200"
  
  # Logging Configuration
  Logging__MinimumLevel: "Warning"
  Logging__EnableConsole: "true"
  Logging__UseJsonFormat: "true"
  Logging__Elasticsearch__Enabled: "true"
  Logging__Elasticsearch__Url: "http://elasticsearch:9200"
  
  # Service URLs (internal)
  AUCTION_SERVICE_URL: "http://auction-api:80"
  BIDDING_SERVICE_URL: "http://bidding-api:80"
  PAYMENT_SERVICE_URL: "http://payment-api:80"
  NOTIFICATION_SERVICE_URL: "http://notification-api:80"
  IDENTITY_SERVICE_URL: "http://identity-api:80"
  ANALYTICS_SERVICE_URL: "http://analytics-api:80"
  SEARCH_SERVICE_URL: "http://search-api:80"
  STORAGE_SERVICE_URL: "http://storage-api:80"
  JOB_SERVICE_URL: "http://job-api:80"
