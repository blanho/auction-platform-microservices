apiVersion: v1
kind: ServiceAccount
metadata:
  name: auction-platform-secrets-sa
  namespace: auction-platform
  annotations:
    azure.workload.identity/client-id: "REPLACE_WITH_MANAGED_IDENTITY_CLIENT_ID"
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: auction-platform-azure-kv
  namespace: auction-platform
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: "https://REPLACE_WITH_KEYVAULT_NAME.vault.azure.net"
      serviceAccountRef:
        name: auction-platform-secrets-sa
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: auction-platform-secrets
  namespace: auction-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: auction-platform-azure-kv
    kind: SecretStore
  target:
    name: auction-platform-secrets
    creationPolicy: Owner
  data:
    - secretKey: RABBITMQ_USER
      remoteRef:
        key: auction-platform-rabbitmq-user
    - secretKey: RABBITMQ_PASSWORD
      remoteRef:
        key: auction-platform-rabbitmq-password
    - secretKey: JWT_SECRET
      remoteRef:
        key: auction-platform-jwt-secret
    - secretKey: Identity__SecretKey
      remoteRef:
        key: auction-platform-jwt-secret
    - secretKey: RabbitMQ__Username
      remoteRef:
        key: auction-platform-rabbitmq-user
    - secretKey: RabbitMQ__Password
      remoteRef:
        key: auction-platform-rabbitmq-password
    - secretKey: AUCTION_DB_CONNECTION
      remoteRef:
        key: auction-platform-auction-db-connection
    - secretKey: BIDDING_DB_CONNECTION
      remoteRef:
        key: auction-platform-bidding-db-connection
    - secretKey: PAYMENT_DB_CONNECTION
      remoteRef:
        key: auction-platform-payment-db-connection
    - secretKey: NOTIFICATION_DB_CONNECTION
      remoteRef:
        key: auction-platform-notification-db-connection
    - secretKey: IDENTITY_DB_CONNECTION
      remoteRef:
        key: auction-platform-identity-db-connection
    - secretKey: ANALYTICS_DB_CONNECTION
      remoteRef:
        key: auction-platform-analytics-db-connection
    - secretKey: CATALOG_DB_CONNECTION
      remoteRef:
        key: auction-platform-catalog-db-connection
    - secretKey: STORAGE_DB_CONNECTION
      remoteRef:
        key: auction-platform-storage-db-connection
    - secretKey: JOB_DB_CONNECTION
      remoteRef:
        key: auction-platform-job-db-connection
    - secretKey: REDIS_CONNECTION
      remoteRef:
        key: auction-platform-redis-connection
    - secretKey: ELASTICSEARCH_USERNAME
      remoteRef:
        key: auction-platform-elasticsearch-username
    - secretKey: ELASTICSEARCH_PASSWORD
      remoteRef:
        key: auction-platform-elasticsearch-password
    - secretKey: SendGrid__ApiKey
      remoteRef:
        key: auction-platform-sendgrid-api-key
    - secretKey: SendGrid__FromEmail
      remoteRef:
        key: auction-platform-sendgrid-from-email
    - secretKey: Twilio__AccountSid
      remoteRef:
        key: auction-platform-twilio-account-sid
    - secretKey: Twilio__AuthToken
      remoteRef:
        key: auction-platform-twilio-auth-token
    - secretKey: Twilio__FromNumber
      remoteRef:
        key: auction-platform-twilio-from-number
    - secretKey: Firebase__ProjectId
      remoteRef:
        key: auction-platform-firebase-project-id
    - secretKey: Firebase__ServiceAccountJson
      remoteRef:
        key: auction-platform-firebase-service-account-json
    - secretKey: STRIPE_SECRET_KEY
      remoteRef:
        key: auction-platform-stripe-secret-key
    - secretKey: STRIPE_WEBHOOK_SECRET
      remoteRef:
        key: auction-platform-stripe-webhook-secret
    - secretKey: Stripe__SecretKey
      remoteRef:
        key: auction-platform-stripe-secret-key
    - secretKey: Stripe__WebhookSecret
      remoteRef:
        key: auction-platform-stripe-webhook-secret
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: identity-signing-keys
  namespace: auction-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: auction-platform-azure-kv
    kind: SecretStore
  target:
    name: identity-signing-keys
    creationPolicy: Owner
  data:
    - secretKey: signingKey
      remoteRef:
        key: auction-platform-identity-signing-key
