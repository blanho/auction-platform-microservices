apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: auction-platform-staging

resources:
  - ../../base

labels:
  - pairs:
      environment: staging
    includeSelectors: true

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      labelSelector: tier=backend
  - patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 5
    target:
      kind: HorizontalPodAutoscaler
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 512Mi
    target:
      kind: Deployment
      labelSelector: tier=backend
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: Kestrel__Endpoints__Grpc__Url
          value: http://+:8081
    target:
      kind: Deployment
      labelSelector: app in (auction-api,bidding-api,catalog-api)
  - patch: |-
      - op: replace
        path: /metadata/annotations/nginx.ingress.kubernetes.io~1ssl-redirect
        value: "false"
      - op: remove
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
      - op: remove
        path: /spec/tls
      - op: replace
        path: /spec/rules/0/host
        value: api.staging.auction-platform.test
      - op: replace
        path: /spec/rules/1/host
        value: staging.auction-platform.test
    target:
      kind: Ingress
      name: auction-platform-ingress
  # These placeholders make a disposable staging namespace self-consistent,
  # but they are not credentials. Replace this Secret from the deployment
  # environment before exposing staging outside an isolated test cluster.
  - patch: |-
      apiVersion: v1
      kind: Secret
      metadata:
        name: auction-platform-secrets
      stringData:
        POSTGRES_USER: staging_user
        POSTGRES_PASSWORD: replace-before-shared-staging-postgres
        REDIS_PASSWORD: replace-before-shared-staging-redis
        RABBITMQ_USER: staging_rabbit
        RABBITMQ_PASSWORD: replace-before-shared-staging-rabbitmq
        JWT_SECRET: replace-before-shared-staging-jwt-signing-key-2026
        Identity__SecretKey: replace-before-shared-staging-jwt-signing-key-2026
        RabbitMQ__Username: staging_rabbit
        RabbitMQ__Password: replace-before-shared-staging-rabbitmq
        AUCTION_DB_CONNECTION: Host=postgres;Port=5432;Database=auction_db;Username=staging_user;Password=replace-before-shared-staging-postgres
        BIDDING_DB_CONNECTION: Host=postgres;Port=5432;Database=bid_db;Username=staging_user;Password=replace-before-shared-staging-postgres
        PAYMENT_DB_CONNECTION: Host=postgres;Port=5432;Database=payment_db;Username=staging_user;Password=replace-before-shared-staging-postgres
        NOTIFICATION_DB_CONNECTION: Host=postgres;Port=5432;Database=notification_db;Username=staging_user;Password=replace-before-shared-staging-postgres
        IDENTITY_DB_CONNECTION: Host=postgres;Port=5432;Database=identity_db;Username=staging_user;Password=replace-before-shared-staging-postgres
        ANALYTICS_DB_CONNECTION: Host=postgres;Port=5432;Database=analytics_db;Username=staging_user;Password=replace-before-shared-staging-postgres
        CATALOG_DB_CONNECTION: Host=postgres;Port=5432;Database=catalog_db;Username=staging_user;Password=replace-before-shared-staging-postgres
        STORAGE_DB_CONNECTION: Host=postgres;Port=5432;Database=storage_db;Username=staging_user;Password=replace-before-shared-staging-postgres
        JOB_DB_CONNECTION: Host=postgres;Port=5432;Database=job_db;Username=staging_user;Password=replace-before-shared-staging-postgres
        REDIS_CONNECTION: redis:6379,password=replace-before-shared-staging-redis
        STRIPE_SECRET_KEY: sk_test_replace_before_shared_staging
        STRIPE_WEBHOOK_SECRET: whsec_replace_before_shared_staging
        Stripe__SecretKey: sk_test_replace_before_shared_staging
        Stripe__WebhookSecret: whsec_replace_before_shared_staging
    target:
      kind: Secret
      name: auction-platform-secrets

configMapGenerator:
  - name: auction-platform-config
    namespace: auction-platform
    behavior: merge
    literals:
      - ASPNETCORE_ENVIRONMENT=Staging
      - Logging__MinimumLevel=Information
      - FileStorage__Provider=Local
      - Kestrel__Endpoints__Http__Url=http://+:8080
      - Cors__AllowedOrigins__0=http://staging.auction-platform.test
      - FrontendUrl=http://staging.auction-platform.test
      # Non-routable values satisfy startup validation without enabling delivery.
      - SendGrid__ApiKey=staging-disabled-sendgrid-key
      - SendGrid__FromEmail=noreply@staging.auction-platform.test
      - SendGrid__FromName=Auction Platform Staging
      - SendGrid__SandboxMode=true
      - Twilio__AccountSid=staging-disabled-account
      - Twilio__AuthToken=staging-disabled-auth-token
      - Twilio__FromNumber=+10000000000
      - Firebase__ProjectId=staging-disabled-project

images:
  - name: auction-platform/auction-api
    newTag: staging
  - name: auction-platform/bidding-api
    newTag: staging
  - name: auction-platform/payment-api
    newTag: staging
  - name: auction-platform/notification-api
    newTag: staging
  - name: auction-platform/identity-api
    newTag: staging
  - name: auction-platform/analytics-api
    newTag: staging
  - name: auction-platform/search-api
    newTag: staging
  - name: auction-platform/storage-api
    newTag: staging
  - name: auction-platform/job-api
    newTag: staging
  - name: auction-platform/catalog-api
    newTag: staging
  - name: auction-platform/gateway-api
    newTag: staging
  - name: auction-platform/web
    newTag: staging
